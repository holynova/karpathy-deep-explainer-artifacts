<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%">
  <title>认知工件实验室 — 从被动阅读文本，到操纵高密度软件工件</title>
  <desc>Dark zinc hero: four ascending steps show the modal evolution from raw text to interactive artifact, beside the lab title.</desc>
  <g>
    <rect width="1200" height="440" rx="16" fill="#09090b"/>
    <rect width="1200" height="440" rx="16" fill="none" stroke="#27272a" stroke-width="1.5"/>
  </g>
  <!-- left copy -->
  <g>
    <g>
      <rect x="60" y="52" width="292" height="32" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
      <text x="206" y="74" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#d4d4d8">KARPATHY ARTIFACTS · 认知工件</text>
    </g>
    <text x="60" y="152" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800" fill="#fafafa">认知工件实验室</text>
    <text x="60" y="198" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#d4d4d8">从被动阅读文本，到操纵高密度软件工件</text>
    <text x="60" y="231" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="18" letter-spacing="1" fill="#a1a1aa">COGNITIVE PROTOTYPES · AI EXPLAINER ARTIFACTS</text>
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">
      <g>
        <rect x="60" y="272" width="132" height="44" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
        <text x="126" y="301" text-anchor="middle" fill="#fafafa">5 个专题</text>
      </g>
      <g>
        <rect x="208" y="272" width="132" height="44" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
        <text x="274" y="301" text-anchor="middle" fill="#fafafa">54 个小节</text>
      </g>
      <g>
        <rect x="356" y="272" width="152" height="44" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
        <text x="432" y="301" text-anchor="middle" fill="#fafafa">20+ 交互沙箱</text>
      </g>
    </g>
    <text x="60" y="366" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#a1a1aa">前端 · 分布式 · 提示词 · 两位创作者的观点整理</text>
  </g>
  <!-- right: 4 ascending steps -->
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(600, 252)">
      <rect x="0" y="0" width="128" height="132" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="64" y="34" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#a1a1aa">01</text>
      <text x="64" y="66" text-anchor="middle" font-size="19" font-weight="700" fill="#e4e4e7">原始文本</text>
      <text x="64" y="92" text-anchor="middle" font-size="14" fill="#a1a1aa">Raw Text</text>
      <text x="64" y="116" text-anchor="middle" font-size="14" fill="#a1a1aa">认知负荷：高</text>
    </g>
    <g transform="translate(740, 196)">
      <rect x="0" y="0" width="128" height="188" rx="10" fill="#18181b" stroke="#52525b" stroke-width="1"/>
      <text x="64" y="34" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#a1a1aa">02</text>
      <text x="64" y="66" text-anchor="middle" font-size="19" font-weight="700" fill="#e4e4e7">STE100 规约</text>
      <text x="64" y="92" text-anchor="middle" font-size="14" fill="#a1a1aa">Structured</text>
      <text x="64" y="116" text-anchor="middle" font-size="14" fill="#a1a1aa">Spec</text>
    </g>
    <g transform="translate(880, 140)">
      <rect x="0" y="0" width="128" height="244" rx="10" fill="#1c1c1f" stroke="#63666e" stroke-width="1"/>
      <text x="64" y="34" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#a1a1aa">03</text>
      <text x="64" y="66" text-anchor="middle" font-size="19" font-weight="700" fill="#fafafa">架构拓扑</text>
      <text x="64" y="92" text-anchor="middle" font-size="14" fill="#a1a1aa">Topology</text>
      <g stroke="#a1a1aa" stroke-width="1.5" fill="none">
        <circle cx="44" cy="150" r="9" fill="#27272a"/>
        <circle cx="84" cy="150" r="9" fill="#27272a"/>
        <circle cx="64" cy="118" r="9" fill="#27272a"/>
        <line x1="64" y1="127" x2="48" y2="143"/>
        <line x1="64" y1="127" x2="80" y2="143"/>
      </g>
    </g>
    <g transform="translate(1020, 84)">
      <rect x="0" y="0" width="128" height="300" rx="10" fill="#fafafa" stroke="#fafafa" stroke-width="1"/>
      <text x="64" y="34" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#71717a">04</text>
      <text x="64" y="66" text-anchor="middle" font-size="19" font-weight="700" fill="#09090b">动态工件</text>
      <text x="64" y="92" text-anchor="middle" font-size="14" fill="#52525b">Artifact</text>
      <g>
        <rect x="24" y="116" width="80" height="10" rx="5" fill="#d4d4d8"/>
        <rect x="24" y="134" width="80" height="10" rx="5" fill="#d4d4d8"/>
        <rect x="24" y="158" width="36" height="36" rx="8" fill="#09090b"/>
        <rect x="68" y="158" width="36" height="36" rx="8" fill="none" stroke="#09090b" stroke-width="2"/>
        <circle cx="88" cy="228" r="12" fill="none" stroke="#09090b" stroke-width="2"/>
        <line x1="88" y1="228" x2="88" y2="220" stroke="#09090b" stroke-width="2"/>
        <line x1="88" y1="228" x2="94" y2="228" stroke="#09090b" stroke-width="2"/>
      </g>
      <text x="64" y="272" text-anchor="middle" font-size="14" fill="#52525b">可操纵 · 可调参</text>
    </g>
    <!-- rising arrow -->
    <g>
      <polyline points="664,236 804,180 944,124 1084,68" fill="none" stroke="#fafafa" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
      <polygon points="1084,56 1074,74 1094,72" fill="#fafafa"/>
    </g>
  </g>
</svg>
